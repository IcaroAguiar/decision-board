name: Agentic Quality Gate

on:
  # labeled: o rótulo run-full-ci dispara só o job full, sem repetir o quality-gate.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_baseline:
        description: Refresh baseline after a passing main/default-branch run
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

# Um commit novo no mesmo PR torna a rodada anterior inútil: cancelá-la poupa minutos da cota.
concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # O único job de todo PR: lint, tipos, testes dos pacotes (sem banco) e varredura de segredos.
  # Orçamento de trabalho de 5 minutos: se estourar, a correção é tirar peso do job, nunca aumentar o orçamento.
  quality-gate:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.action != 'labeled'
    # Runner hospedado: o repositório é público e não há runner próprio que o atenda.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "GATE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.6 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Os testes de apps/api precisam de PostgreSQL: rodam no job full.
      - name: Package tests
        run: corepack pnpm -r --if-present --filter './packages/*' test

      - name: Gate script syntax check
        run: |
          node --check docs/ai/quality-gate/check-ratchet.mjs
          node --check docs/ai/quality-gate/refresh-baseline.mjs
          node --check docs/ai/quality-gate/vendor/collect-review-context.mjs

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Clean transient secret scan artifacts
        run: rm -f results.sarif

      - name: Work budget
        run: |
          elapsed=$(( $(date +%s) - GATE_STARTED ))
          echo "quality-gate trabalhou ${elapsed}s (orçamento: 300s)"
          [[ $elapsed -le 300 ]]

  # Camada completa (PostgreSQL real, migrações, testes da API, cobertura, smoke, build, pacote de
  # revisão agêntico e catraca): só a pedido (rótulo run-full-ci), no push à main ou pelo botão
  # Run workflow.
  full:
    if: >-
      github.event_name != 'pull_request'
      || (!github.event.pull_request.draft
        && contains(github.event.pull_request.labels.*.name, 'run-full-ci')
        && (github.event.action != 'labeled' || github.event.label.name == 'run-full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: decision_board
          POSTGRES_USER: decision_board
          POSTGRES_PASSWORD: decision_board
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decision_board -d decision_board"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://decision_board:decision_board@localhost:5432/decision_board?schema=public
      BETTER_AUTH_SECRET: ci-only-auth-key-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.6 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Database migrations
        run: pnpm db:deploy

      - name: Tests
        run: pnpm test

      - name: Coverage
        run: pnpm coverage

      - name: API smoke
        run: pnpm smoke:api

      - name: Build
        run: pnpm build

      - name: Agentic review packet
        env:
          AGENTIC_REVIEW_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}
        run: node docs/ai/quality-gate/vendor/collect-review-context.mjs --base "$AGENTIC_REVIEW_BASE" --json > docs/ai/quality-gate/agentic-review-packet.json

      - name: Ratchet quality gate
        env:
          AGENTIC_REVIEW_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}
        run: node docs/ai/quality-gate/check-ratchet.mjs

      - name: Refresh baseline artifact
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_baseline == true && github.ref == 'refs/heads/main'
        run: node docs/ai/quality-gate/refresh-baseline.mjs

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentic-quality-gate
          path: |
            docs/ai/quality-gate/baseline.json
            docs/ai/quality-gate/*report*.json
            docs/ai/quality-gate/*report*.md
            docs/ai/quality-gate/quality-trend-entry.json
            docs/ai/quality-gate/quality-trend.jsonl
            docs/ai/quality-gate/auto-improvement-queue.json
            docs/ai/quality-gate/agentic-review-packet.json
            coverage/coverage-summary.json
            coverage/lcov.info
