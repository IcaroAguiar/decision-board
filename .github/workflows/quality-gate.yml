name: Agentic Quality Gate

on:
  # Sem labeled: rótulo não reemite este check. A camada a pedido (run-full-ci) está em full-ci.yml;
  # o rótulo run-ci em PR de fork vale na próxima rodada (novo commit ou reabrir o PR).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# Um commit novo no mesmo PR torna a rodada anterior inútil: cancelá-la poupa minutos da cota.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # O único job de todo PR: lint, tipos, testes dos pacotes (sem banco) e varredura de segredos.
  # Orçamento de trabalho de 5 minutos: se estourar, a correção é tirar peso do job, nunca aumentar o orçamento.
  quality-gate:
    if: >-
      !github.event.pull_request.draft
      && (github.event.pull_request.head.repo.full_name == github.repository
        || contains(github.event.pull_request.labels.*.name, 'run-ci'))
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_CI || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - run: echo "GATE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.6 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Os testes de apps/api precisam de PostgreSQL: rodam em full-ci.yml (job full).
      - name: Package tests
        run: corepack pnpm -r --if-present --filter './packages/*' test

      - name: Gate script syntax check
        run: |
          node --check docs/ai/quality-gate/check-ratchet.mjs
          node --check docs/ai/quality-gate/refresh-baseline.mjs
          node --check docs/ai/quality-gate/vendor/collect-review-context.mjs

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Clean transient secret scan artifacts
        run: rm -f results.sarif

      - name: Work budget
        run: |
          elapsed=$(( $(date +%s) - GATE_STARTED ))
          echo "quality-gate trabalhou ${elapsed}s (orçamento: 300s)"
          [[ $elapsed -le 300 ]]
